[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "soccervision"
version = "0.1.0"
description = "SoccerVision 3D: soccer video analysis and spatial reconstruction (Phase 1: person detection pipeline)."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "SoccerVision 3D contributors" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
# Core library: schemas, video I/O (PyAV bundles FFmpeg), annotation, pipeline orchestration.
# Lower bounds are the versions this project was developed and tested against.
dependencies = [
    "av>=19.0.2,<20",
    "numpy>=2.1,<3",
    "pillow>=11.0,<14",
    "pydantic>=2.11,<3",
]

[project.optional-dependencies]
# Real model inference. Not needed for unit tests or CI.
ml = [
    "torch>=2.6,<3",
    "torchvision>=0.21",
    "rfdetr>=1.11.2,<2",
]
api = [
    "fastapi>=0.162,<1",
    "pydantic-settings>=2.16,<3",
    "python-multipart>=0.0.20",
    "uvicorn[standard]>=0.54,<1",
]
dev = [
    "httpx>=0.28,<1",
    "mypy>=2.4",
    "pytest>=9.0",
    "ruff>=0.17,<0.18",
]

[project.scripts]
soccervision = "soccervision.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["packages/soccervision", "apps/api/soccervision_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: real-model inference tests; opt-in via SOCCERVISION_RUN_INTEGRATION=1",
]
filterwarnings = [
    "ignore::DeprecationWarning:rfdetr.*",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["packages", "apps/api", "tests"]
extend-exclude = ["apps/web"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PTH", "C4"]
ignore = ["B008"]

[tool.ruff.lint.pycodestyle]
# The formatter wraps code at 100; allow slightly longer unsplittable strings/docstrings.
max-line-length = 110

[tool.ruff.lint.isort]
known-first-party = ["soccervision", "soccervision_api", "support"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PTH"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["soccervision", "soccervision_api"]
mypy_path = ["packages", "apps/api"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["rfdetr", "rfdetr.*", "torch", "torch.*", "supervision", "supervision.*"]
ignore_missing_imports = true
